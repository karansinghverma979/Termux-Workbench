    <text x="40" y="475" fill="#63b3ed">Host:       <tspan fill="#e2e8f0">Lava Blaze 5G (8GB RAM / 128GB UFS)</tspan></text>
    <text x="40" y="495" fill="#63b3ed">Uptime:     <tspan fill="#e2e8f0">2 days, 10 hours, 28 mins</tspan></text>
    <text x="40" y="515" fill="#63b3ed">Battery:    <tspan fill="#48bb78">73% (Discharging, 40.6°C)</tspan></text>
