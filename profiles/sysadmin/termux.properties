###############
# Profile: Sysadmin & Server Operations
###############

allow-external-apps = true
default-working-directory = /data/data/com.termux/files/home
disable-terminal-session-change-toast = true
terminal-transcript-rows = 10000
use-fullscreen-workaround = true
terminal-cursor-blink-rate = 400
terminal-cursor-style = underline

extra-keys = [ \
  [ \
    { key: ESC, popup: { macro: "CTRL c", display: "SIGINT" } }, \
    { key: '|', display: "PIPE", popup: '>' }, \
    { key: '&', display: "BG", popup: '&&' }, \
    { macro: "sudo ", display: "SUDO", popup: { macro: "su -\n", display: "ROOT" } }, \
    { macro: "grep -rn ", display: "GREP", popup: { macro: "htop\n", display: "HTOP" } }, \
    { key: UP, display: "🔼", popup: { key: PGUP } }, \
    { key: KEYBOARD, popup: { key: PASTE } } \
  ], \
  [ \
    { key: CTRL, popup: { macro: "CTRL z", display: "TSTP" } }, \
    { key: DRAWER, popup: { macro: "peer\n", display: "PEER" } }, \
    { key: ALT, popup: { macro: "exit\n", display: "EXIT" } }, \
    { macro: "ssh ", display: "SSH", popup: { macro: "sshd\n", display: "SSHD" } }, \
    { key: LEFT, display: "◀️", popup: { key: HOME } }, \
    { key: DOWN, display: "🔽", popup: { key: PGDN } }, \
    { key: RIGHT, display: "▶️", popup: { key: END } } \
  ] \
]

use-black-ui = true
bell-character = ignore
back-key = back
ctrl-space-workaround = true
terminal-margin-horizontal = 0
terminal-margin-vertical = 0

shortcut.create-session = ctrl + t
shortcut.next-session = ctrl + 2
shortcut.previous-session = ctrl + 1
shortcut.rename-session = ctrl + n
