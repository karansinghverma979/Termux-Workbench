###############
# General
###############

# Allow external applications to execute arbitrary commands within Termux (Required for Termux:API & automation)
allow-external-apps = true

# Default working directory when launching app
default-working-directory = /data/data/com.termux/files/home

# Disable toasts shown on terminal session change
disable-terminal-session-change-toast = true

# Adjust terminal scrollback buffer (Increased for viewing long logs/outputs)
terminal-transcript-rows = 5000

###############
# Layout & Workarounds
###############

use-fullscreen-workaround = true

###############
# Cursor
###############

# Smooth blinking block cursor
terminal-cursor-blink-rate = 500
terminal-cursor-style = block

###############
# Extra keys (Modernized & Preserved 2x7 Grid)
###############

extra-keys = [ \
  [ \
    { key: TAB, display: "🔁", popup: { key: ESC } }, \
    { key: '/', display: "🚀", popup: '|' }, \
    { key: QUOTE, display: "⏸️", popup: "*" }, \
    { key: '-', display: "➖", popup: '_' }, \
    { key: '=', display: "🟰", popup: ':' }, \
    { key: UP, display: "🔼", popup: { key: PGUP } }, \
    { key: KEYBOARD, popup: { key: PASTE } } \
  ], \
  [ \
    { key: CTRL, popup: { key: "$" } }, \
    { key: DRAWER, display: "🗂️", popup: { key: "$HOME/" } }, \
    { key: ALT, popup: { key: "$PREFIX/" } }, \
    { key: "&&", display: "🏠", popup: "||" }, \
    { key: LEFT, display: "◀️", popup: { key: HOME } }, \
    { key: DOWN, display: "🔽", popup: { key: PGDN } }, \
    { key: RIGHT, display: "▶️", popup: { key: END } } \
  ] \
]

###############
# Colors / AMOLED Black UI
###############

# Force AMOLED true black colors for drawer and dialogs
use-black-ui = true

###############
# Bell Character
###############

# Ignore audible bell beeps on mobile
bell-character = ignore

###############
# Back key
###############

back-key = back

###############
# Keyboard Issue Workarounds
###############

# Enable Ctrl+Space workaround across Android keyboards
ctrl-space-workaround = true

###############
# Terminal Margins
###############

# Maximize screen space on mobile portrait screens
terminal-margin-horizontal = 0
terminal-margin-vertical = 0

###############
# Session Navigation Shortcuts
###############
shortcut.create-session = ctrl + t
shortcut.next-session = ctrl + 2
shortcut.previous-session = ctrl + 1
shortcut.rename-session = ctrl + n
