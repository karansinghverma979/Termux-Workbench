# =========================================================
# 📱 Termux High-Speed AMOLED Tmux Configuration (~/.tmux.conf)
# =========================================================

# --- PERFORMANCE & ESCAPE TIME ---
set -s escape-time 0               # Zero escape delay (Essential for fast vim/nano response)
set -g history-limit 10000         # 10k lines of scrollback
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# --- DUAL PREFIX (Ctrl+B and Ctrl+A) ---
set -g prefix C-b
set -g prefix2 C-a
bind C-a send-prefix -2

# --- TOUCH & MOUSE SUPPORT ---
set -g mouse on                    # Tap to select panes, swipe to scroll

# --- FAST WINDOW SPLITS (Preserve directory) ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- FAST VIM-STYLE PANE NAVIGATION ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- CONFIG RELOAD ---
bind r source-file ~/.tmux.conf \; display-message "⚡ Tmux config reloaded!"

# --- AMOLED BLACK MINIMAL STATUS BAR ---
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-style bg=black,fg=white
set -g status-left-length 30
set -g status-right-length 50

set -g status-left "#[fg=black,bg=cyan,bold] 📱 #S #[default] "
set -g status-right "#[fg=yellow,bold]%H:%M #[default]"

set -g window-status-current-format "#[fg=black,bg=green,bold] #I:#W #[default]"
set -g window-status-format "#[fg=white,bg=black] #I:#W "

# --- PANE BORDER COLORS ---
set -g pane-border-style fg=brightblack
set -g pane-active-border-style fg=cyan
