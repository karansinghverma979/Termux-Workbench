name: Termux Matrix Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate JSON syntax
        run: |
          jq empty config/terminal_titles.json

      - name: Validate Shell Script Syntax
        run: |
          bash -n install.sh
          for script in scripts/*.sh; do
            if [ -f "$script" ]; then
              bash -n "$script"
            fi
          done
