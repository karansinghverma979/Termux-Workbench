name: Termux Matrix Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate JSON syntax
        run: |
          jq empty config/terminal_titles.json

      - name: Validate Shell Script Syntax
        run: |
          bash -n install.sh
          for script in scripts/*.sh; do
            if [ -f "$script" ]; then
              bash -n "$script"
            fi
          done
